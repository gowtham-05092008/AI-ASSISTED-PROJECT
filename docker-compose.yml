services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smart_logistics
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/smart_logistics
      SECRET_KEY: change-this-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - mysql
volumes:
  mysql_data:
